<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Campus</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial}
body{
  background:linear-gradient(135deg,#0a0f2c,#2b1055);
  color:#fff;min-height:100vh
}
nav{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 28px;background:rgba(0,0,0,.3)
}
nav h2{color:#4fc3f7}
nav .links button{margin-left:10px}

.glow-btn{
  padding:10px 26px;border:none;border-radius:26px;
  background:linear-gradient(45deg,#4fc3f7,#7b2ff7);
  color:#fff;cursor:pointer;
  box-shadow:0 0 14px #4fc3f7;transition:.25s
}
.glow-btn:hover{
  box-shadow:0 0 26px #4fc3f7,0 0 48px #7b2ff7;
  transform:scale(1.05)
}

.section{display:none;padding:40px}
.active{display:block}

.card{
  background:rgba(255,255,255,.15);
  padding:20px;border-radius:14px;margin:14px 0;
  backdrop-filter:blur(10px)
}
input,select,textarea{
  width:100%;padding:10px;margin:8px 0;border-radius:6px;border:none
}

#msg{margin:10px 0;padding:10px;border-radius:6px;display:none}
.success{background:#2ecc71}
.error{background:#e74c3c}

.loader{display:none;text-align:center}
.loader span{
  display:inline-block;width:10px;height:10px;
  background:#4fc3f7;border-radius:50%;
  animation:bounce 1s infinite alternate
}
.loader span:nth-child(2){animation-delay:.2s}
.loader span:nth-child(3){animation-delay:.4s}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}

.hero{margin-top:30px;display:flex;gap:30px;align-items:center}
.hero img{width:280px;border-radius:20px;box-shadow:0 0 30px #4fc3f7}

/* Chatbot */
#chatbot{
  position:fixed;right:18px;bottom:18px;width:260px;
  background:#ffffff;color:#000;border-radius:14px;display:none
}
#chat-header{
  background:#2b1055;color:#fff;padding:10px;
  border-radius:14px 14px 0 0;cursor:pointer
}
#chat-body{height:300px;overflow-y:auto;padding:8px;font-size:14px}
#chat-input{width:100%;padding:8px;border:none;border-top:1px solid #ddd}
.right-fab{position:fixed;right:18px;bottom:18px}

.hero{
  margin-top:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:30px;
  flex-wrap:wrap;
}

.hero-img{
  width:100%;
  max-width:360px;   
  height:auto;
}

.hero > div{
  max-width:420px;
}
@media (max-width:600px){
  @media (max-width:600px){
  nav{
    padding:5px 10px;
  }

  nav h2{
    font-size:5px;
  }

  nav .links button{
    padding:6px 14px;
    font-size:10px;
    border-radius:15px;
  }
}

  .hero{
    flex-direction:column;
    align-items:center;
    gap:20px;
  }

  .hero-img{
    width:200px !important;
    max-width:200px !important;
  }

  h1{
    font-size:22px;
  }

  p{
    font-size:13px;
  }
}
/* Navbar */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  background:#2b1055; /* main site colour */
  color:white;
  position:sticky;
  top:0;
  z-index:999;
}

nav h2{
  margin:0;
}

.nav-menu{
  display:flex;
  list-style:none;
  gap:15px;
}

.nav-menu li a{
  text-decoration:none;
  color:white;
  font-size:16px;
}

.nav-toggle{
  font-size:24px;
  background:none;
  border:none;
  color:white;
  cursor:pointer;
  display:none;
}

/* Mobile Responsive */
@media(max-width:600px){
  .contact-cards{
    flex-direction: column;
    gap: 15px;
  }
  .contact-cards .card{
    width: 100%;
  }
}


</style>
</head>

<body>

<nav>
  <h2>Smart Campus</h2>
  <div class="links">
    <button class="glow-btn" onclick="showSection('home')">Home</button>
    <button class="glow-btn" onclick="showSection('login')">Login</button>
    <button class="glow-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- HOME -->
<section id="home" class="section active">
  <h1>Smart Campus Student Support Platform</h1>
  <p>A digital platform to raise, track and resolve student issues efficiently.</p>

  <div class="hero">
    <div>
      <p>AI-powered student services & complaint tracking system.</p><br>
      <button class="glow-btn" onclick="showSection('login')">Get Started</button>
    </div>
    <img src="image.jpeg" class="hero-img">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  </div>
</section>

<!-- LOGIN -->
<section id="login" class="section">
  <div class="card">
    <h2>Select Login Type</h2><br>
    <button class="glow-btn" onclick="showStudentLogin()">🎓 Student</button>
    <button class="glow-btn" onclick="showAdminLogin()">🧑‍💼 Admin</button>

    <div id="student-login" style="display:none;margin-top:15px">
      <input placeholder="Register Number">
      <select>
        <option>Select Department</option>
        <option>Bsc CS(AI)</option><option>Bsc CS(DSA)</option>
        <option>Bsc CS</option><option>BCA</option>
        <option>Bsc biochemistry</option><option>BCom CA</option>
        <option>BCom PA</option><option>BBA</option>
      </select>
      <button class="glow-btn" onclick="login('student')">Login</button>
    </div>

    <div id="admin-login" style="display:none;margin-top:15px">
      <input placeholder="Email ID">
      <input type="password" placeholder="Password">
      <button class="glow-btn" onclick="login('admin')">Login</button>
    </div>

    <div id="msg"></div>
    <div class="loader" id="loader">
      <span></span><span></span><span></span>
    </div>
  </div>
</section>

<!-- STUDENT -->
<section id="student" class="section">
  <h2>Student Dashboard</h2>

  <div class="card">
    <h3>Raise Complaint</h3>
    <textarea id="reqMsg" placeholder="Enter your issue"></textarea>
    <button class="glow-btn" onclick="submitComplaint()">Submit</button>
  </div>

  <div class="card">
    <h3>Your Complaints</h3>
    <ul id="studentList"></ul>
  </div>
</section>

<!-- ADMIN -->
<section id="admin" class="section">
  <h2>Admin Panel</h2>
  <div class="card">
    <ul id="adminList"></ul>
  </div>
</section>

<!-- CHATBOT -->
<div id="chatbot">
  <div id="chat-header" onclick="toggleChat()">AI Help 🤖</div>
  <div id="chat-body"></div>
  <input id="chat-input" placeholder="Ask about fees / exam" onkeydown="chat(event)">
</div>
<button class="glow-btn right-fab" onclick="toggleChat()">Chat</button>

<script>
let complaints=[];

function showSection(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showStudentLogin(){
  document.getElementById("student-login").style.display="block";
  document.getElementById("admin-login").style.display="none";
}
function showAdminLogin(){
  document.getElementById("admin-login").style.display="block";
  document.getElementById("student-login").style.display="none";
}

function login(type){
  document.getElementById("loader").style.display="block";
  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
    showSection(type);
  },1000);
}

function logout(){
  showSection('home');
}

function submitComplaint(){
  let msg = document.getElementById("reqMsg").value.trim();
  if(!msg){showMsg("Please enter complaint","error");return;}

  complaints.push({
    msg,
    date:new Date().toLocaleString(),
    ci:false,hod:false,principal:false
  });
  document.getElementById("reqMsg").value="";
  render();
  showMsg("Complaint submitted successfully","success");
}

function render(){
  let sList=document.getElementById("studentList");
  let aList=document.getElementById("adminList");
  sList.innerHTML=""; aList.innerHTML="";

  complaints.forEach((c,i)=>{
    let status=c.principal?"Approved":"Pending";
    sList.innerHTML+=`<li>${c.msg}<br><small>${c.date}</small> <b>${status}</b></li><br>`;
    aList.innerHTML+=`
      <li>${c.msg}<br>
      CI <input type="checkbox" onchange="complaints[${i}].ci=this.checked">
      HOD <input type="checkbox" onchange="complaints[${i}].hod=this.checked">
      Principal <input type="checkbox" onchange="complaints[${i}].principal=this.checked">
      </li><br>`;
  });
}

function showMsg(t,type){
  let m=document.getElementById("msg");
  m.innerText=t;m.className=type;m.style.display="block";
  setTimeout(()=>m.style.display="none",2000);
}

function toggleChat(){
  let bot=document.getElementById("chatbot");
  bot.style.display=bot.style.display==="block"?"none":"block";
}
function chat(e){
  if(e.key==="Enter"){
    let body=document.getElementById("chat-body");
    body.innerHTML+=`<p><b>You:</b> ${e.target.value}</p>
    <p><b>Bot:</b> Please contact office.</p>`;
    e.target.value="";body.scrollTop=body.scrollHeight;
  }
}

</script>

</body>
</html>
